version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # tsvector has no default pgx/v5 codec — scanning it into the
          # otherwise-generated `interface{}` fails outright ("cannot scan
          # unknown type (OID 3614)"). The app layer never reads this
          # column (it's trigger-maintained, used only via @@ in SQL), so
          # a plain string is enough to make it scannable.
          - column: "jobs.search_vector"
            go_type: "string"
